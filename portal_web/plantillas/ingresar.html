{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<section class="tarjeta estrecha">
  <h1>Ingresar</h1>
  <p class="sub">Proveedores de la {{ institucion }}: ingrese con su cédula o correo.</p>
  {% if error %}<div class="mensaje error" role="alert">{{ error }}</div>{% endif %}
  <form class="campos" method="post" action="/ingresar">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="usuario">Cédula o correo<input id="usuario" name="usuario" required autocomplete="username" value="{{ usuario or '' }}"></label>
    <label for="password">Contraseña<input id="password" name="password" type="password" required autocomplete="current-password"></label>
    <button type="submit">Ingresar</button>
  </form>
  <p class="sub">¿Primera vez? <a href="/registro">Registre su empresa o su cédula física</a>.</p>
</section>
{% endblock %}
